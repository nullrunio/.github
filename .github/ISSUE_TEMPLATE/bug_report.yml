name: Bug report
description: Report something that isn't working as documented
title: "[bug]: "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the
        template below — the more context, the faster we can reproduce
        and fix it.

  - type: input
    id: component
    attributes:
      label: Affected component
      description: Which repo / module is affected?
      placeholder: "nullrun-sdk-python / nullrun.decorators / @protect"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Exact SDK/package version, commit SHA, tag, or gateway version from /healthz
      placeholder: "nullrun 0.13.11; gateway 1.6.8 from /healthz"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps or code to reproduce the issue. Redact API keys, secrets, prompts, and private data.
      placeholder: |
        ```python
        from nullrun import protect, init

        init(api_key="...")
        @protect
        def my_agent(prompt): ...
        ```
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python version, SDK version, API URL, and hosted plan or local development setup
      placeholder: "Python 3.12 on macOS 14, nullrun 0.13.11, hosted Lite plan"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste relevant redacted logs or error responses. Do not include credentials, HMAC secrets, prompts, or completions.
      render: shell
    validations:
      required: false
