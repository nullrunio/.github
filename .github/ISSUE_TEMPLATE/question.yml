name: Question
description: Ask how something works, or get clarification
title: "[q]: "
labels: ["question", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Quick questions are welcome. For the fastest response, use
        [Discord](https://discord.gg/N63ECwnV3). For private or account-specific
        questions, email support@nullrun.io so the answer doesn't get lost in
        the issue tracker. Please do not include credentials or private data.

  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: What I've already tried
    validations:
      required: false
